<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoToss - Swipe to Clean Your Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #E8A090;
            --delete: #FF6B6B;
            --keep: #4ECDC4;
            --favorite: #FFD93D;
            --text: #1a1a1a;
            --text-secondary: #8e8e93;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
            color: var(--text);
            line-height: 1.5;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .content { max-width: 600px; }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 27px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(232, 160, 144, 0.3);
        }

        h1 {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1.1em;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        .swipe-demo {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .swipe-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .swipe-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: white;
        }

        .swipe-delete { background: var(--delete); }
        .swipe-keep { background: var(--keep); }
        .swipe-favorite { background: var(--favorite); color: #333; }

        .swipe-label {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .app-store-btn {
            display: inline-block;
            margin-bottom: 50px;
        }

        .app-store-btn img {
            height: 54px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            text-align: left;
        }

        .feature {
            padding: 20px;
        }

        .feature-icon {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .feature h3 {
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature p {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        footer {
            padding: 40px 20px;
            text-align: center;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 12px;
            font-size: 0.9em;
        }

        footer a:hover {
            color: var(--accent);
        }

        .copyright {
            margin-top: 12px;
            color: var(--text-secondary);
            font-size: 0.8em;
        }

        @media (max-width: 500px) {
            .hero { padding: 40px 20px; }
            h1 { font-size: 1.7em; }
            .swipe-demo { gap: 25px; }
            .swipe-icon { width: 50px; height: 50px; font-size: 20px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <img src="appicon.png" alt="PhotoToss" class="app-icon">
            <h1>PhotoToss</h1>
            <p class="tagline">Dating App for Your Photos</p>

            <div class="swipe-demo">
                <div class="swipe-item">
                    <div class="swipe-icon swipe-delete">✕</div>
                    <span class="swipe-label">Delete</span>
                </div>
                <div class="swipe-item">
                    <div class="swipe-icon swipe-keep">✓</div>
                    <span class="swipe-label">Keep</span>
                </div>
                <div class="swipe-item">
                    <div class="swipe-icon swipe-favorite">♥</div>
                    <span class="swipe-label">Favorite</span>
                </div>
            </div>

            <a href="https://apps.apple.com/app/phototoss" class="app-store-btn">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
            </a>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <h3>100% Private</h3>
                    <p>Photos never leave your device</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">☁️</div>
                    <h3>iCloud Ready</h3>
                    <p>Review photos from the cloud</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">✈️</div>
                    <h3>Offline Mode</h3>
                    <p>Preload up to 1000 photos</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">🌍</div>
                    <h3>21 Languages</h3>
                    <p>Available worldwide</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <a href="privacy.html">Privacy Policy</a>
        <a href="support.html">Support</a>
        <p class="copyright">© 2026 Maciej Dutkiewicz</p>
    </footer>
</body>
</html>
